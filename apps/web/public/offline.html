<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NextIn — Hors ligne</title>
    <style>
      :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --label: #000; --secondary: rgb(60 60 67 / 0.6); --accent: #1a6bb5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgb(235 235 245 / 0.6); --accent: #5ea8f0; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--label);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 24px; }
      main { max-width: 22rem; width: 100%; background: var(--card); border-radius: 22px; padding: 32px 24px; text-align: center; }
      svg { width: 44px; height: 44px; color: var(--secondary); }
      h1 { font-size: 1.375rem; line-height: 1.75rem; margin: 16px 0 8px; }
      p { font-size: 0.9375rem; line-height: 1.25rem; color: var(--secondary); margin: 0 0 4px; }
      button { margin-top: 24px; height: 50px; width: 100%; border: 0; border-radius: 14px; background: #1a6bb5; color: #fff;
        font: 600 1.0625rem/1 inherit; cursor: pointer; }
      button:active { transform: scale(0.97); opacity: 0.85; }
      .en { margin-top: 12px; font-size: 0.8125rem; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.86a10 10 0 0 0-2-1.43" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" /><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" /><path d="m2 2 20 20" />
      </svg>
      <h1>Vous êtes hors ligne</h1>
      <p>Vérifiez votre connexion. Votre ticket reste valable : la page se mettra à jour dès le retour du réseau.</p>
      <p class="en" lang="en">You're offline. Your ticket is still valid.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
