<style>
/* Écran TV v2 : toujours clair (lisible à 3 m), police système, aplats ; flash d'appel vert plein écran */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --page:#E5E5EA; --pagetext:#000; --pagetext2:rgba(60,60,67,.64);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#000;--pagetext:#fff;--pagetext2:rgba(235,235,245,.62);color-scheme:dark}}
:root[data-theme="dark"]{--page:#000;--pagetext:#fff;--pagetext2:rgba(235,235,245,.62);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--pagetext);font-family:var(--font);-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.page h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.page > p{margin:-6px 0 10px;color:var(--pagetext2);font-size:15px;max-width:70ch;line-height:1.45}
.cap{font-size:14px;color:var(--pagetext2);margin:6px 0 22px}
.cap b{color:var(--pagetext)}

/* Écran 16:9 : toujours clair, tailles relatives à la largeur de l'écran (cqw) */
.tv{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;container-type:inline-size;border:6px solid #1C1C1E;
  --bg:#F2F2F7;--cell:#FFFFFF;--sep:rgba(60,60,67,.14);--label:#000;--label2:rgba(60,60,67,.62);--navy:#0D2C54;--blue:#1A6BB5;--orange:#F58B1F;--green:#15A05A;
  background:var(--bg);color:var(--label);display:grid;grid-template-rows:auto 1fr auto}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:1.4cqw;padding:1.6cqw 2.4cqw;background:var(--navy);color:#fff}
.top svg{width:3.4cqw;height:3.4cqw}
.top b{font-size:2.1cqw;font-weight:700}
.top small{font-size:1.3cqw;opacity:.7;margin-left:.6cqw}
.top .time{margin-left:auto;font-size:2.4cqw;font-weight:600}
.content{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:1.6cqw;padding:1.6cqw 2.4cqw;min-height:0}
.calls{background:var(--cell);border-radius:1.4cqw;padding:1.4cqw 2cqw;display:flex;flex-direction:column;min-height:0}
.calls h2{margin:0 0 .6cqw;font-size:1.5cqw;font-weight:600;color:var(--label2);display:grid;grid-template-columns:1fr 1fr;text-transform:uppercase;letter-spacing:.04em}
.call{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:1cqw 0;border-top:.15cqw solid var(--sep)}
.call .tk{font-size:6cqw;font-weight:700;color:var(--navy);line-height:1}
.call .where{font-size:2.9cqw;font-weight:600}
.call .where small{display:block;font-size:1.4cqw;font-weight:400;color:var(--label2);margin-top:.2cqw}
.call.new{box-shadow:inset .5cqw 0 0 var(--orange);padding-left:1.4cqw;margin-left:-1.4cqw}
.call.new .where::after{content:"Appel";display:inline-block;margin-left:1cqw;font-size:1.2cqw;font-weight:700;color:#fff;background:var(--orange);border-radius:99px;padding:.25cqw .9cqw;vertical-align:.6cqw}
.side{display:flex;flex-direction:column;gap:1.6cqw;min-height:0}
.ad{flex:1;border-radius:1.4cqw;overflow:hidden;position:relative;background:#0E7A44;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:1.6cqw}
.ad svg{position:absolute;inset:0;width:100%;height:100%}
.ad .tag{position:absolute;top:1.2cqw;left:1.2cqw;font-size:1cqw;font-weight:600;background:rgba(0,0,0,.35);border-radius:99px;padding:.3cqw .9cqw}
.ad b{position:relative;font-size:2.3cqw;line-height:1.15;font-weight:700}
.ad small{position:relative;font-size:1.3cqw;opacity:.9;margin-top:.4cqw}
.next{background:var(--cell);border-radius:1.4cqw;padding:1.2cqw 1.6cqw}
.next h3{margin:0 0 .6cqw;font-size:1.3cqw;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.next .row{display:flex;gap:1.4cqw;font-size:2.4cqw;font-weight:700;color:var(--navy);flex-wrap:wrap}
.bottom{display:flex;align-items:center;gap:1.6cqw;padding:1cqw 2.4cqw 1.4cqw;font-size:1.4cqw;color:var(--label2)}
.bottom .dots{display:flex;gap:.5cqw;align-items:flex-end}
.bottom .dots i{width:.8cqw;height:.8cqw;border-radius:50%;background:var(--blue)}
.bottom .dots i:nth-child(2){width:.7cqw;height:.7cqw}.bottom .dots i:nth-child(3){width:.6cqw;height:.6cqw}
.bottom b{color:var(--label);font-weight:600}
.bottom .code{margin-left:auto;display:flex;align-items:center;gap:.8cqw}
.bottom .code span{font-family:var(--num);font-size:2cqw;font-weight:700;color:var(--label);letter-spacing:.2cqw;background:var(--cell);border-radius:.8cqw;padding:.2cqw 1cqw}

/* Flash d'appel */
.flash{background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8cqw;grid-template-rows:none}
.flash .k{font-size:2.6cqw;font-weight:600;opacity:.92}
.flash .big{font-size:17cqw;font-weight:700;line-height:.95;letter-spacing:-.02em}
.flash .go{font-size:4.6cqw;font-weight:700}
.flash .svc{font-size:2cqw;opacity:.85}
.flash .bar{width:30cqw;height:.6cqw;border-radius:99px;background:rgba(255,255,255,.3);margin-top:2cqw;overflow:hidden}
.flash .bar i{display:block;height:100%;width:62%;background:#fff;border-radius:99px}
</style>

<h1>NextIn — écran TV : compléments v2</h1>
<p>Les états de l'écran que la maquette 09 ne montrait pas : l'appairage, l'activation du son, l'écran sans appel, sans publicité, hors ligne, révoqué ou indisponible. Toujours clair, lisible à 3 mètres, sans aucun nom de patient.</p>
