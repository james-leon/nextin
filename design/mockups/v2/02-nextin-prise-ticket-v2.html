<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>NextIn Prise de ticket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Refonte v2 : police système Apple, aplats, une seule couleur d'accent par écran, listes groupées, motif des points du logo */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --page:#E5E5EA; --bg:#F2F2F7; --cell:#FFFFFF; --sep:rgba(60,60,67,.18); --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --fill:rgba(118,118,128,.12); --navy:#0D2C54; --onnavy:#FFFFFF; --blue:#1A6BB5; --orange:#F58B1F; --orange-text:#B85E00; --green:#15A05A; --tint:#E8F0F9;
  --bar:rgba(249,249,249,.94); --ticket:#0D2C54; --frame:#1C1C1E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#000;--bg:#000000;--cell:#1C1C1E;--sep:rgba(84,84,88,.6);--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--fill:rgba(118,118,128,.24);--navy:#2A6FB5;--blue:#4A9BE8;--orange-text:#FFA94D;--tint:#15263D;--bar:rgba(22,22,24,.94);--ticket:#FFFFFF;--frame:#3A3A3C;color-scheme:dark}}
:root[data-theme="dark"]{--page:#000;--bg:#000000;--cell:#1C1C1E;--sep:rgba(84,84,88,.6);--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--fill:rgba(118,118,128,.24);--navy:#2A6FB5;--blue:#4A9BE8;--orange-text:#FFA94D;--tint:#15263D;--bar:rgba(22,22,24,.94);--ticket:#FFFFFF;--frame:#3A3A3C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:17px;letter-spacing:-.01em}
.page{max-width:1400px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;margin-bottom:28px}
.intro h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.intro p{margin:6px 0 0;color:var(--label2);font-size:15px;max-width:52ch;line-height:1.45}
.changes{display:flex;flex-wrap:wrap;gap:8px;max-width:640px}
.changes span{font-size:13px;background:var(--cell);border-radius:999px;padding:7px 12px;color:var(--label)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 24px;justify-items:center}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:320px}
figcaption{font-size:13px;color:var(--label2);text-align:center}
figcaption b{color:var(--label);font-weight:600;display:block;font-size:15px}

/* Téléphone */
.phone{width:100%;max-width:320px;aspect-ratio:320/660;border-radius:46px;background:var(--frame);padding:9px}
.screen{position:relative;width:100%;height:100%;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 26px 0 30px;font-size:15px;font-weight:600;flex:none}
.status i{display:flex;gap:5px;align-items:center}
.status svg{width:17px;height:12px;fill:currentColor}
.body{flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.large{font-size:31px;font-weight:700;letter-spacing:-.025em;margin:4px 0 0;line-height:1.1}
.over{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;font-weight:500}
.navbar{display:flex;align-items:center;height:36px;color:var(--blue);font-size:17px;gap:2px;flex:none;padding:0 8px}
.navbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Listes groupées iOS */
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.ghead{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:0 0 -10px 16px}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 14px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,14px);border-top:.5px solid var(--sep)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:13px;color:var(--label2);margin-top:1px}
.row .v{font-size:16px;color:var(--label2)}
.chev{width:8px;height:13px;stroke:var(--label3);fill:none;stroke-width:2;flex:none}
.pastille{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;flex:none;font-family:var(--num)}
.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.sq svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:12px;border:0;font:inherit;font-size:17px;font-weight:600;width:100%}
.btn.primary{background:var(--navy);color:var(--onnavy)}
.btn.action{background:var(--orange);color:#fff}
.btn.tinted{background:var(--tint);color:var(--blue)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{color:var(--label2);font-size:15px;text-align:center}

/* Barre d'onglets iOS */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar);border-top:.5px solid var(--sep);padding:6px 4px 22px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--label2)}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}

/* Motif des points du logo */
.dots{display:flex;align-items:flex-end;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--fill)}
.dots i.done{background:var(--label3)}
.dots i.me{width:14px;height:14px;background:var(--orange)}
.loader{display:flex;gap:7px;align-items:flex-end;height:16px}
.loader i{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:hop 1.2s infinite ease-in-out}
.loader i:nth-child(2){animation-delay:.15s;width:8px;height:8px}.loader i:nth-child(3){animation-delay:.3s;width:7px;height:7px}
@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}}
@media (prefers-reduced-motion:reduce){.loader i{animation:none;opacity:.8}}

/* Ticket */
.num{font-family:var(--num);font-weight:700;letter-spacing:-.02em}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.tk{background:var(--cell);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.tk .code{font-size:68px;line-height:1;color:var(--ticket)}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep);padding-top:12px}
.stats div + div{border-left:.5px solid var(--sep);padding-left:14px}
.stats b{display:block;font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1}
.stats small{font-size:13px;color:var(--label2)}

/* Écrans spéciaux */
.splash{background:var(--cell);align-items:center;justify-content:center;gap:16px}
.splash .logo{width:92px;height:92px}
.splash h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.splash p{margin:-8px 0 8px;color:var(--label2);font-size:15px}
.called{background:var(--green);color:#fff}
.called .status{color:#fff}
.called .body{justify-content:center;align-items:center;text-align:center;gap:10px}
.called .btn{background:#fff;color:#0B6B3C;margin-top:28px}
.photo{height:126px;background:#C9D6E3;position:relative;display:flex;align-items:flex-end;padding:10px}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.feat{background:var(--cell);border-radius:16px;overflow:hidden}
.feat .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.feat b{font-size:17px;font-weight:600}
.feat small{font-size:13px;color:var(--label2)}
.chips{display:flex;gap:8px;overflow:hidden}
.chip{flex:none;font-size:14px;font-weight:500;padding:7px 13px;border-radius:999px;background:var(--fill);color:var(--label)}
.chip.on{background:var(--navy);color:var(--onnavy)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--cell);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:126px}
.game b{font-size:16px;font-weight:600}
.game small{font-size:13px;color:var(--label2);margin-top:-8px}
.mini{display:flex;align-items:center;gap:10px;background:var(--cell);border-radius:12px;padding:10px 14px}
.mini .num{font-size:22px;color:var(--ticket);white-space:nowrap}
.mini .live{white-space:nowrap}
.mini small{color:var(--label2);font-size:13px}
.sponsor{font-size:12px;color:var(--label2);text-align:center}
</style>
<style>
.lead{margin:-6px 0 0;font-size:15px;color:var(--label2);line-height:1.4}
.fine{font-size:12px;color:var(--label2);text-align:center}
.scan{background:#000;color:#fff}
.scan .status{color:#fff;position:absolute;top:0;left:0;right:0;z-index:2}
.scanview{position:absolute;inset:0}
.scanview > svg{width:100%;height:100%;filter:blur(1.2px) brightness(.8)}
.frame{position:absolute;left:50%;top:51%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%)}
.frame i{position:absolute;width:26%;height:26%;border:4px solid #fff;border-radius:4px}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:18px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:18px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:18px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:18px}
.scanbottom{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 30px;display:flex;flex-direction:column;gap:6px;text-align:center;background:rgba(0,0,0,.55)}
.scanbottom b{font-size:17px;font-weight:600}
.scanbottom small{font-size:13px;color:rgba(255,255,255,.75)}
.scanacts{display:flex;gap:10px;justify-content:center;margin-top:10px}
.glass{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.18);font-size:15px;font-weight:600}
.glass.round{width:44px;padding:0;justify-content:center}
.glass svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.otp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.otp span{height:62px;border-radius:12px;background:var(--cell);display:grid;place-items:center;font-family:var(--num);font-size:30px;font-weight:700;color:var(--ticket)}
.otp span.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.hint{font-size:13px;color:var(--label2);margin-top:-6px}
.keys{flex:none;background:#D1D3D9;padding:8px 3px 26px;display:flex;flex-direction:column;gap:9px}
.krow{display:flex;gap:4px;justify-content:center}
.krow span{flex:1;max-width:26px;height:38px;border-radius:5px;background:#fff;display:grid;place-items:center;font-size:17px;color:#000;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.krow span.w{max-width:40px;background:#ABB0BA;font-size:14px}
.selrow{background:var(--tint)}
.row.dis .t b,.row.dis .t small{color:var(--label3)}
.form{display:flex;flex-direction:column}
.field{display:flex;flex-direction:column;gap:2px;padding:9px 14px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.field span{font-size:12px;color:var(--label2)}
.field input{border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);padding:0;outline:0}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none}
.box.on{background:var(--navy);border-color:var(--navy)}
.box svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.done{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.done svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.notice{display:flex;gap:10px;background:var(--cell);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4}
.notice svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px}
</style>

<div class="page">
  <header class="intro">
    <div>
      <h1>NextIn — prise de ticket v2</h1>
      <p>Du QR code de l'accueil jusqu'au ticket, en 4 écrans. Le nom n'est demandé que si l'établissement l'exige, et il ne s'affiche jamais à l'écran de la salle.</p>
    </div>
    <div class="changes" aria-label="Étapes"><span>1 · Scanner</span><span>ou Saisir le code</span><span>2 · Choisir le service</span><span>3 · Votre nom</span><span>4 · Ticket pris</span></div>
  </header>
  <div class="grid">

    <!-- Scanner -->
    <figure>
      <div class="phone"><div class="screen scan">
